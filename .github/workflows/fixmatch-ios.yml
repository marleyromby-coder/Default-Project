name: fixmatch-ios
# Builds the FixMatch iPhone app and its widget extension with Xcode, the same way
# `npm run ios:xcode` followed by ▶︎ (Debug, iPhone) and Product → Archive does on a Mac,
# so build errors show up here. Builds without signing: everything is compiled, but no
# Apple account is needed.
on:
  push:
    paths:
      - 'fixmatch/**'
      - '.github/workflows/fixmatch-ios.yml'
  workflow_dispatch:

concurrency:
  group: fixmatch-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 27 builds with the iOS 27 SDK: iPhone Duo full screen and the extra-large widget.
          - runner: xcode-27
            xcode: '27.1'
          - runner: macos-26
            xcode: '26.6'
    defaults:
      run:
        working-directory: fixmatch
    env:
      CI: '1'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode ${{ matrix.xcode }}
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcrun swift --version
          pod --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixmatch/package-lock.json

      - run: npm ci

      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: pod install
        working-directory: fixmatch/ios
        run: pod install

      - name: Build for the simulator (Debug, like ▶︎ on iPhone 17 Pro)
        working-directory: fixmatch/ios
        run: |
          set -o pipefail
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in runtime for d in ds]
          names = [d['name'] for d in devices]
          print(next((n for n in ['iPhone 17 Pro', 'iPhone 17'] if n in names), next(n for n in names if n.startswith('iPhone'))))
          ")
          echo "Simulator: $SIMULATOR"
          xcodebuild build \
            -workspace FixMatch.xcworkspace \
            -scheme FixMatch \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            > simulator.log 2>&1 || { grep -nE -A3 ' error: |^error:|fatal error|BUILD FAILED' simulator.log | head -120; exit 1; }
          grep -E 'BUILD SUCCEEDED' simulator.log

      - name: Build for iPhone (Debug, like ▶︎ in Xcode)
        if: success() || failure()
        working-directory: fixmatch/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace FixMatch.xcworkspace \
            -scheme FixMatch \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            > debug.log 2>&1 || { grep -nE ' error: |^error:|fatal error|BUILD FAILED' debug.log | head -60; exit 1; }
          grep -E 'BUILD SUCCEEDED' debug.log

      - name: Archive (Release, like Product → Archive)
        if: success() || failure()
        working-directory: fixmatch/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace FixMatch.xcworkspace \
            -scheme FixMatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FixMatch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            > archive.log 2>&1 || { grep -nE ' error: |^error:|fatal error|ARCHIVE FAILED' archive.log | head -60; exit 1; }
          grep -E 'ARCHIVE SUCCEEDED' archive.log
          ls "$RUNNER_TEMP/FixMatch.xcarchive/Products/Applications/FixMatch.app/PlugIns"

      - name: Count errors and warnings
        if: always()
        working-directory: fixmatch/ios
        run: |
          python3 - simulator.log debug.log archive.log <<'EOF'
          import collections, os, re, sys
          for name in sys.argv[1:]:
              if not os.path.exists(name):
                  continue
              errors, warnings = set(), set()
              for line in open(name, errors='replace'):
                  line = line.rstrip()
                  match = re.search(r'(/\S+?):\d+(?::\d+)?: (warning|error): (.*)', line)
                  if match:
                      (warnings if match.group(2) == 'warning' else errors).add((match.group(1), match.group(3)))
                  elif re.match(r'^(warning|error): ', line):
                      kind, _, message = line.partition(': ')
                      (warnings if kind == 'warning' else errors).add(('', message))
              origin = lambda path: next((name for name in ('node_modules', 'Pods', 'DerivedData') if f'/{name}/' in path), 'project')
              print(f'{name}: {len(errors)} errors, {len(warnings)} warnings')
              print('  warnings by origin:', dict(collections.Counter(origin(p) for p, _ in warnings)))
              for path, message in sorted(e for e in errors)[:40]:
                  print('  ERROR', path.split('/fixmatch/')[-1], '–', message[:200])
              for path, message in sorted(warnings)[:80]:
                  print('  WARNING', path.split('/fixmatch/')[-1] or '(build setting)', '–', message[:200])
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-${{ matrix.xcode }}-logs
          path: |
            fixmatch/ios/simulator.log
            fixmatch/ios/debug.log
            fixmatch/ios/archive.log
          if-no-files-found: ignore
